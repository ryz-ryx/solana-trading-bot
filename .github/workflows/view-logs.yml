name: View Logs

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours back to show (default: 24)'
        required: false
        default: '24'
      strategy:
        description: 'Filter by strategy: sniper | copy_trade | kol | all'
        required: false
        default: 'all'

jobs:
  view-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Show Bot Activity
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HOURS:                ${{ github.event.inputs.hours }}
          STRATEGY:             ${{ github.event.inputs.strategy }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta

          URL = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_SERVICE_KEY"]
          HOURS = int(os.environ.get("HOURS", "24"))
          STRATEGY = os.environ.get("STRATEGY", "all")

          H = {
            "apikey": KEY,
            "Authorization": f"Bearer {KEY}",
            "Accept": "application/json",
          }

          since = (datetime.now(timezone.utc) - timedelta(hours=HOURS)).isoformat()

          def fetch(path):
            r = urllib.request.Request(f"{URL}/rest/v1/{path}", headers=H)
            with urllib.request.urlopen(r) as resp:
              return json.loads(resp.read())

          strat_filter = "" if STRATEGY == "all" else f"&strategy=eq.{STRATEGY}"

          trades  = fetch(f"paper_trades?created_at=gte.{since}{strat_filter}&order=created_at.desc&limit=200")
          open_pos = fetch(f"portfolio?select=*&order=updated_at.desc&limit=50")

          buys  = [t for t in trades if t["action"] == "buy"]
          sells = [t for t in trades if t["action"] == "sell"]
          wins  = [t for t in sells if (t["pnl_sol"] or 0) > 0]
          losses= [t for t in sells if (t["pnl_sol"] or 0) <= 0]

          total_pnl = sum(t["pnl_sol"] or 0 for t in sells)
          win_rate  = len(wins)/len(sells)*100 if sells else 0
          avg_win   = sum(t["pnl_pct"] or 0 for t in wins)/len(wins) if wins else 0
          avg_loss  = sum(t["pnl_pct"] or 0 for t in losses)/len(losses) if losses else 0

          print("=" * 60)
          print(f"  BOT ACTIVITY REPORT — last {HOURS}h  |  strategy: {STRATEGY}")
          print("=" * 60)
          print(f"\n  SUMMARY")
          print(f"  -------")
          print(f"  Buys:        {len(buys)}")
          print(f"  Sells:       {len(sells)}  (wins: {len(wins)}  losses: {len(losses)})")
          print(f"  Win rate:    {win_rate:.1f}%")
          print(f"  Total PnL:   {total_pnl:+.4f} SOL")
          print(f"  Avg win:     {avg_win:+.1f}%")
          print(f"  Avg loss:    {avg_loss:+.1f}%")
          print(f"  Open positions: {len(open_pos)}")

          if open_pos:
            print(f"\n  OPEN POSITIONS")
            print(f"  --------------")
            for p in open_pos:
              print(f"  [{p['strategy']}] {p['token_symbol']} | amt: {p['amount']:.4f} | entry: {p['avg_entry_sol']:.6f} SOL")

          if sells:
            print(f"\n  RECENT CLOSED TRADES (last {min(20, len(sells))})")
            print(f"  " + "-"*58)
            for t in sells[:20]:
              ts = t["created_at"][:16].replace("T", " ")
              sym = (t["token_symbol"] or "?")[:8].ljust(8)
              pnl = t["pnl_sol"] or 0
              pct = t["pnl_pct"] or 0
              flag = "✓" if pnl > 0 else "✗"
              print(f"  {flag} {ts}  [{t['strategy'][:6]}]  {sym}  {pct:+6.1f}%  {pnl:+.4f} SOL")

          if buys:
            print(f"\n  RECENT BUYS (last {min(10, len(buys))})")
            print(f"  " + "-"*58)
            for t in buys[:10]:
              ts = t["created_at"][:16].replace("T", " ")
              sym = (t["token_symbol"] or "?")[:8].ljust(8)
              print(f"  → {ts}  [{t['strategy'][:6]}]  {sym}  {t['amount_sol']:.4f} SOL @ {t['price_sol']:.6f}")

          print("\n" + "=" * 60)
          EOF
